name: Publish Signatures

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  push:
    tags:
      - "signatures-*"

permissions:
  contents: write

concurrency:
  group: publish-signatures
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install signing dependency
        run: pip install "cryptography>=42.0.0"
      - name: Build and sign the bundle (fixed name for a rolling release)
        env:
          BINARYSNIFFER_SIGNING_KEY: ${{ secrets.BINARYSNIFFER_SIGNING_KEY }}
        run: |
          python build.py signatures
          ls -la dist
      - name: Publish/refresh the rolling 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Overwrite a single rolling release so the Releases list stays clean
          # and the client always finds one bundle. Provenance lives in the
          # release's updated timestamp and the manifest inside the bundle.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/signatures.zip dist/signatures.zip.sig \
            --title "Signatures (latest)" --latest \
            --notes "Rolling signed signature bundle. Verify with the trusted Ed25519 key; updated $(date -u +%Y-%m-%dT%H:%MZ)."
